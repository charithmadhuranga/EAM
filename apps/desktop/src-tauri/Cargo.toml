[package]
name = "esphome-automation-manager"
version = "0.1.0"
description = "ESPHome Automation Manager - Desktop Application"
authors = ["ESPHome Automation Manager Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
eam-domain = { path = "../../../crates/eam-domain" }
eam-esphome-api = { path = "../../../crates/eam-esphome-api" }
eam-discovery = { path = "../../../crates/eam-discovery" }
eam-storage = { path = "../../../crates/eam-storage" }
eam-entity-registry = { path = "../../../crates/eam-entity-registry" }
eam-device-manager = { path = "../../../crates/eam-device-manager" }
eam-runtime = { path = "../../../crates/eam-runtime" }
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
